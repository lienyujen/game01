<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>電子白板飛鏢對戰 (標準版)</title>
  <!-- 載入 React, ReactDOM, Babel 與 Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; background-color: #0f172a; margin: 0; padding: 0; }
    #root { height: 100vh; width: 100vw; overflow: hidden; }
    /* 自訂捲軸樣式 */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    /* 結鏢閃爍特效 */
    @keyframes checkoutPulse {
      0% { 
        fill: #fef08a !important; 
        stroke: #ffffff !important; 
        stroke-width: 3px !important; 
        filter: drop-shadow(0 0 5px #fde047); 
      }
      100% { 
        fill: #ca8a04 !important; 
        stroke: #fef08a !important; 
        stroke-width: 1px !important; 
        filter: drop-shadow(0 0 0px transparent); 
      }
    }
    .checkout-target {
      animation: checkoutPulse 0.5s infinite alternate !important;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- 圖示元件 ---
    const Target = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const Users = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const Play = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polygon points="6 3 20 12 6 21 6 3"/></svg>;
    const RotateCcw = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const Undo2 = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>;
    const Trophy = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
    const Volume2 = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
    const VolumeX = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>;

    // --- 標準飛鏢盤設定 ---
    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const RADIUS = {
      BOARD: 290,
      NUMBERS: 250,
      DOUBLE_OUT: 220,
      DOUBLE_IN: 200,
      TREBLE_OUT: 135,
      TREBLE_IN: 115,
      BULL_OUT: 35,
      BULL_IN: 15
    };

    // --- Web Audio API 音效系統 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const playSound = (type) => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      switch (type) {
        case 'bullseye':
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now); osc.stop(now + 0.6);
          
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.connect(gain2); gain2.connect(audioCtx.destination);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(659.25, now);
          gain2.gain.setValueAtTime(0, now);
          gain2.gain.linearRampToValueAtTime(0.4, now + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc2.start(now); osc2.stop(now + 0.5);
          break;
        case 'treble':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.4, now + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
          break;
        case 'double':
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.4, now + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
          break;
        case 'single':
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.3, now + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
          break;
        case 'miss':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.3);
          gainNode.gain.setValueAtTime(0.4, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
          break;
        case 'bust':
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.6);
          gainNode.gain.setValueAtTime(0.5, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
          osc.start(now); osc.stop(now + 0.8);
          break;
        case 'win':
          const freqs = [523.25, 659.25, 783.99, 1046.50]; 
          freqs.forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine'; o.frequency.value = freq;
            const t = now + i * 0.15;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.4, t + 0.05);
            g.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
            o.start(t); o.stop(t + 0.5);
          });
          break;
      }
    };

    function App() {
      const [gameState, setGameState] = useState('setup'); 
      const [numPlayers, setNumPlayers] = useState(2);
      const [startingScore, setStartingScore] = useState(301);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [isDoubleOut, setIsDoubleOut] = useState(false); 

      const [players, setPlayers] = useState([]);
      const [activePlayerIndex, setActivePlayerIndex] = useState(0);
      const [currentRound, setCurrentRound] = useState(1); 
      const [turnStartScore, setTurnStartScore] = useState(0);
      const [turnDarts, setTurnDarts] = useState([]);
      const [turnMessage, setTurnMessage] = useState('');
      const [winner, setWinner] = useState(null);

      const svgRef = useRef(null);
      const lastThrowTime = useRef(0); 

      const startGame = () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const newPlayers = Array.from({ length: numPlayers }, (_, i) => ({
          id: i, 
          name: `玩家 ${i + 1}`, 
          score: startingScore,
          rounds: [] 
        }));
        setPlayers(newPlayers);
        setActivePlayerIndex(0);
        setCurrentRound(1);
        setTurnStartScore(startingScore);
        setTurnDarts([]);
        setTurnMessage('');
        setWinner(null);
        setGameState('playing');
      };

      const handleBoardClick = (e) => {
        e.preventDefault(); 
        
        // --- 修正2：防護多點觸控 ---
        // 如果是多點觸控（例如吸盤球4個吸盤同時撞擊），只認可第一個觸控點
        if (e.nativeEvent && !e.nativeEvent.isPrimary) return;

        if (gameState !== 'playing' || turnMessage !== '') return;

        const now = Date.now();
        // --- 修正3：冷卻時間延長至 4 秒 ---
        // 避免拔取吸盤球時產生摩擦二次感應
        if (now - lastThrowTime.current < 4000) return; 
        lastThrowTime.current = now;

        const svg = svgRef.current;
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const { x, y } = pt.matrixTransform(svg.getScreenCTM().inverse());

        const dx = x - 300;
        const dy = y - 300;
        const distance = Math.sqrt(dx * dx + dy * dy);

        let angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
        angleDeg = (angleDeg + 90) % 360;
        if (angleDeg < 0) angleDeg += 360;

        let points = 0;
        let base = 0;
        let isDouble = false;
        let isTreble = false;
        let isBull = false;

        if (distance > RADIUS.DOUBLE_OUT) {
          points = 0;
        } else if (distance <= RADIUS.BULL_IN) {
          points = 50; base = 25; isDouble = true; isBull = true;
        } else if (distance <= RADIUS.BULL_OUT) {
          points = 25; base = 25; isBull = true;
        } else {
          const shiftedAngle = (angleDeg + 9) % 360;
          const sectorIndex = Math.floor(shiftedAngle / 18);
          base = SECTORS[sectorIndex];

          if (distance > RADIUS.DOUBLE_IN && distance <= RADIUS.DOUBLE_OUT) {
            points = base * 2;
            isDouble = true;
          } else if (distance > RADIUS.TREBLE_IN && distance <= RADIUS.TREBLE_OUT) {
            points = base * 3;
            isTreble = true;
          } else {
            points = base;
          }
        }

        if (soundEnabled) {
          if (points === 0) playSound('miss');
          else if (points === 50) playSound('bullseye');
          else if (isTreble) playSound('treble');
          else if (isDouble) playSound('double');
          else playSound('single');
        }

        processThrow(points, base, { x, y }, isDouble, isTreble, isBull);
      };

      const processThrow = (points, base, pos, isDouble, isTreble, isBull) => {
        const newDarts = [...turnDarts, { points, base, pos, isDouble, isTreble, isBull }];
        setTurnDarts(newDarts);

        const currentTotal = newDarts.reduce((sum, d) => sum + d.points, 0);
        const tentativeScore = turnStartScore - currentTotal;

        let isBust = false;
        let isWin = false;

        if (isDoubleOut) {
          if (tentativeScore < 0 || tentativeScore === 1 || (tentativeScore === 0 && !isDouble)) isBust = true;
          else if (tentativeScore === 0 && isDouble) isWin = true;
        } else {
          if (tentativeScore < 0) isBust = true;
          else if (tentativeScore === 0) isWin = true;
        }

        if (isBust) {
          setTurnMessage('爆鏢 (Bust)!');
          if (soundEnabled) setTimeout(() => playSound('bust'), 300);
          setTimeout(() => endTurn(turnStartScore, newDarts, true), 2000);
        } else if (isWin) {
          setTurnMessage('獲勝！');
          if (soundEnabled) setTimeout(() => playSound('win'), 300);
          
          const updatedPlayers = [...players];
          updatedPlayers[activePlayerIndex].rounds.push({
            roundNum: currentRound,
            darts: newDarts,
            score: currentTotal,
            isBust: false
          });
          updatedPlayers[activePlayerIndex].score = 0;
          setPlayers(updatedPlayers);
          
          setWinner(updatedPlayers[activePlayerIndex]);
          setGameState('over');
        } else if (newDarts.length === 3) {
          setTurnMessage('換下一位');
          setTimeout(() => endTurn(tentativeScore, newDarts, false), 1500);
        }
      };

      const endTurn = (finalScoreForActivePlayer, dartsThrown, isBust) => {
        const updatedPlayers = [...players];
        const roundScore = isBust ? 0 : dartsThrown.reduce((sum, d) => sum + d.points, 0);
        
        updatedPlayers[activePlayerIndex].rounds.push({
          roundNum: currentRound,
          darts: dartsThrown,
          score: roundScore,
          isBust: isBust
        });
        
        updatedPlayers[activePlayerIndex].score = finalScoreForActivePlayer;
        setPlayers(updatedPlayers);
        
        let nextPlayerIdx = activePlayerIndex + 1;
        let nextRound = currentRound;
        
        if (nextPlayerIdx >= numPlayers) {
          nextPlayerIdx = 0;
          nextRound = currentRound + 1;
        }

        // --- 局數上限判定 ---
        if (isDoubleOut) {
          const limit = startingScore === 301 ? 10 : 15;
          if (nextRound > limit) {
            let bestPlayer = updatedPlayers[0];
            let tiedPlayers = [updatedPlayers[0]];
            for (let i = 1; i < numPlayers; i++) {
              if (updatedPlayers[i].score < bestPlayer.score) {
                bestPlayer = updatedPlayers[i];
                tiedPlayers = [updatedPlayers[i]];
              } else if (updatedPlayers[i].score === bestPlayer.score) {
                tiedPlayers.push(updatedPlayers[i]);
              }
            }
            const winnerObj = { ...bestPlayer, name: tiedPlayers.map(p => p.name).join(' & ') };
            setWinner(winnerObj);
            if (soundEnabled) setTimeout(() => playSound('win'), 300);
            setGameState('over');
            return;
          }
        }
        
        setActivePlayerIndex(nextPlayerIdx);
        setCurrentRound(nextRound);
        setTurnStartScore(updatedPlayers[nextPlayerIdx].score);
        setTurnDarts([]);
        setTurnMessage('');
      };

      const undoLastDart = () => {
        if (turnDarts.length === 0 || turnMessage) return;
        setTurnDarts(prev => prev.slice(0, -1));
        // 若復原，防呆時間也要歸零以便立刻重丟
        lastThrowTime.current = 0;
      };

      const resetGame = () => setGameState('setup');

      const getWedgePath = (radius, startAngleDeg, endAngleDeg) => {
        const startRad = (startAngleDeg - 90) * (Math.PI / 180);
        const endRad = (endAngleDeg - 90) * (Math.PI / 180);
        const x1 = 300 + radius * Math.cos(startRad);
        const y1 = 300 + radius * Math.sin(startRad);
        const x2 = 300 + radius * Math.cos(endRad);
        const y2 = 300 + radius * Math.sin(endRad);
        return `M 300 300 L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;
      };

      const getDartLabel = (dart) => {
        if (!dart) return '-';
        if (dart.points === 0) return 'MISS';
        if (dart.isBull) return dart.points === 50 ? 'DB' : 'SB';
        if (dart.isTreble) return `T${dart.base}`;
        if (dart.isDouble) return `D${dart.base}`;
        return `${dart.base}`;
      };

      if (gameState === 'setup') {
        return (
          /* 修正1: w-screen h-screen 確保絕對符合螢幕不產生卷軸 */
          <div className="w-screen h-screen bg-slate-900 flex items-center justify-center font-sans p-2 sm:p-4 overflow-hidden" onContextMenu={(e) => e.preventDefault()}>
            <div className="bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-6 md:p-10 max-w-2xl w-full max-h-full overflow-y-auto custom-scrollbar text-center relative text-white">
              <button onClick={() => setSoundEnabled(!soundEnabled)} className="absolute top-4 right-4 md:top-6 md:right-6 p-2 md:p-3 bg-slate-700 hover:bg-slate-600 rounded-full transition-colors">
                {soundEnabled ? <Volume2 className="w-6 h-6 md:w-8 md:h-8 text-green-400" /> : <VolumeX className="w-6 h-6 md:w-8 md:h-8 text-red-400" />}
              </button>
              <Target className="w-16 h-16 md:w-24 md:h-24 text-blue-500 mx-auto mb-4 md:mb-6" />
              <h1 className="text-3xl md:text-5xl font-extrabold mb-2 md:mb-4">飛標大戰</h1>
              <p className="text-sm md:text-xl text-slate-400 mb-6 md:mb-8 tracking-widest font-bold border-b border-slate-600 pb-4 md:pb-6">請用軟式吸盤球開戰</p>
              
              <div className="mb-6 md:mb-8">
                <h2 className="text-xl md:text-2xl font-bold text-slate-300 mb-3 md:mb-4 flex items-center justify-center gap-2">
                  <Users className="w-6 h-6 md:w-8 md:h-8" /> 選擇遊玩人數
                </h2>
                <div className="flex justify-center gap-3 md:gap-4 flex-wrap">
                  {[1, 2, 3].map(num => (
                    <button key={num} onClick={() => setNumPlayers(num)} className={`w-16 h-16 md:w-24 md:h-24 text-2xl md:text-4xl font-bold rounded-2xl transition-all border-4 ${numPlayers === num ? 'bg-blue-600 border-blue-400 text-white shadow-lg scale-110' : 'bg-slate-700 border-slate-600 text-slate-400 hover:bg-slate-600'}`}>
                      {num}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mb-6 md:mb-8">
                <h2 className="text-xl md:text-2xl font-bold text-slate-300 mb-3 md:mb-4 flex items-center justify-center gap-2">
                  <Target className="w-6 h-6 md:w-8 md:h-8" /> 選擇起始分數
                </h2>
                <div className="flex justify-center gap-4 md:gap-6 flex-wrap">
                  {[301, 501].map(score => (
                    <button key={score} onClick={() => setStartingScore(score)} className={`px-6 py-3 md:px-8 md:py-4 text-2xl md:text-4xl font-bold rounded-2xl transition-all border-4 ${startingScore === score ? 'bg-green-600 border-green-400 text-white shadow-lg scale-110' : 'bg-slate-700 border-slate-600 text-slate-400 hover:bg-slate-600'}`}>
                      {score}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mb-8 md:mb-12">
                <h2 className="text-xl md:text-2xl font-bold text-slate-300 mb-3 md:mb-4 flex items-center justify-center gap-2">
                  <Trophy className="w-6 h-6 md:w-8 md:h-8" /> 結鏢規則
                </h2>
                <div className="flex justify-center gap-4 md:gap-6 flex-wrap">
                  <button onClick={() => setIsDoubleOut(false)} className={`px-4 py-2 md:px-6 md:py-3 text-xl md:text-2xl font-bold rounded-2xl transition-all border-4 ${!isDoubleOut ? 'bg-purple-600 border-purple-400 text-white shadow-lg scale-110' : 'bg-slate-700 border-slate-600 text-slate-400 hover:bg-slate-600'}`}>
                    標準結鏢
                  </button>
                  <button onClick={() => setIsDoubleOut(true)} className={`px-4 py-2 md:px-6 md:py-3 text-xl md:text-2xl font-bold rounded-2xl transition-all border-4 ${isDoubleOut ? 'bg-purple-600 border-purple-400 text-white shadow-lg scale-110' : 'bg-slate-700 border-slate-600 text-slate-400 hover:bg-slate-600'}`}>
                    Double Out
                  </button>
                </div>
              </div>

              <button onClick={startGame} className="w-full py-4 md:py-6 bg-red-600 hover:bg-red-700 border-4 border-red-500 text-white text-3xl md:text-4xl font-black rounded-2xl shadow-xl flex items-center justify-center gap-4 transition-transform active:scale-95">
                <Play className="w-8 h-8 md:w-10 md:h-10" /> 開始
              </button>
            </div>
          </div>
        );
      }

      const currentTotalDarts = turnDarts.reduce((sum, d) => sum + d.points, 0);
      const currentDisplayScore = turnStartScore - currentTotalDarts;
      const canPlay = gameState === 'playing' && turnMessage === '';

      const checkIsTarget = (points, isDoubleArea) => {
        if (!canPlay) return false;
        if (isDoubleOut) {
          return isDoubleArea && (currentDisplayScore === points);
        } else {
          return currentDisplayScore === points;
        }
      };

      return (
        /* 修正1: w-screen h-screen 取代 w-full h-full 鎖定無卷軸的全螢幕版面 */
        <div className="w-screen h-screen bg-slate-900 text-white flex flex-col md:flex-row font-sans overflow-hidden" onContextMenu={(e) => e.preventDefault()}>
          
          {/* 左側或上方：計分板區域。使用縮小機制避免擠壓靶面 */}
          <div className="w-full h-1/3 md:h-full md:w-[350px] lg:w-[450px] bg-slate-800 p-4 md:p-6 flex flex-col shadow-2xl z-10 border-b md:border-b-0 md:border-r border-slate-700 overflow-y-auto custom-scrollbar shrink-0">
            <div className="flex items-center justify-between mb-4 md:mb-6 shrink-0">
              <div>
                <h2 className="text-2xl md:text-3xl font-black text-slate-200 flex items-center gap-2 md:gap-3 mb-1">
                  <Target className="text-red-500 w-6 h-6 md:w-8 md:h-8" /> {startingScore}
                </h2>
                <div className="flex gap-2 flex-wrap">
                  <span className="text-[10px] md:text-sm font-bold text-slate-400 tracking-widest bg-slate-900 px-2 md:px-3 py-1 rounded-full">{isDoubleOut ? 'Double Out' : 'Straight Out'}</span>
                  <span className="text-[10px] md:text-sm font-bold text-blue-400 tracking-widest bg-blue-900/30 px-2 md:px-3 py-1 rounded-full border border-blue-800">第 {currentRound} 局</span>
                </div>
              </div>
              <div className="flex gap-2 md:gap-3 shrink-0">
                 <button onClick={() => setSoundEnabled(!soundEnabled)} className="p-2 md:p-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition-colors">
                  {soundEnabled ? <Volume2 className="w-6 h-6 md:w-8 md:h-8 text-green-400" /> : <VolumeX className="w-6 h-6 md:w-8 md:h-8 text-red-400" />}
                </button>
                <button onClick={resetGame} className="p-2 md:p-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition-colors">
                  <RotateCcw className="w-6 h-6 md:w-8 md:h-8 text-white" />
                </button>
              </div>
            </div>

            <div className="flex-1 flex flex-col gap-3 md:gap-4 overflow-y-auto pr-1 custom-scrollbar">
              {players.map((player, idx) => {
                const isActive = idx === activePlayerIndex;
                const displayScore = isActive ? currentDisplayScore : player.score;
                return (
                  <div key={player.id} className={`relative p-3 md:p-5 rounded-xl md:rounded-3xl border-4 transition-all duration-300 flex flex-col ${isActive ? 'bg-blue-600 border-blue-400 shadow-[0_0_20px_rgba(59,130,246,0.5)] scale-[1.02] z-10 shrink-0' : 'bg-slate-700 border-slate-600 shrink-0'}`}>
                    <div className="flex justify-between items-start mb-1 md:mb-2">
                      <h3 className="text-xl md:text-2xl font-bold">{player.name}</h3>
                      <div className="text-4xl md:text-6xl font-black tracking-tighter">{displayScore}</div>
                    </div>
                    
                    {/* 歷史局數紀錄區塊 */}
                    <div className="mt-1 md:mt-2 pt-2 md:pt-3 border-t border-white/20 flex-1 overflow-y-auto max-h-[100px] md:max-h-[150px] custom-scrollbar pr-1 md:pr-2">
                      {player.rounds.length === 0 && !isActive && (
                        <p className="text-xs md:text-sm text-center opacity-50 py-1 md:py-2">尚未投擲</p>
                      )}
                      <div className="flex flex-col gap-1 md:gap-2">
                        {player.rounds.map((round, rIdx) => (
                          <div key={rIdx} className="flex items-center justify-between bg-black/20 rounded-md md:rounded-lg px-2 py-1 md:px-3 md:py-2 text-xs md:text-sm">
                            <span className="font-bold w-8 md:w-12 opacity-70">R{round.roundNum}</span>
                            <div className="flex gap-1 md:gap-2 flex-1 justify-center">
                              {round.darts.map((d, dIdx) => (
                                <span key={dIdx} className={`w-6 md:w-8 text-center ${d.points === 0 ? 'text-red-400' : ''}`}>
                                  {getDartLabel(d)}
                                </span>
                              ))}
                              {Array.from({ length: 3 - round.darts.length }).map((_, i) => (
                                <span key={`empty-${i}`} className="w-6 md:w-8 text-center opacity-30">-</span>
                              ))}
                            </div>
                            <span className={`font-black w-8 md:w-10 text-right ${round.isBust ? 'text-red-400 text-[10px] md:text-xs' : 'text-yellow-400'}`}>
                              {round.isBust ? 'BUST' : round.score}
                            </span>
                          </div>
                        ))}
                        
                        {isActive && turnDarts.length > 0 && (
                          <div className="flex items-center justify-between bg-white/20 rounded-md md:rounded-lg px-2 py-1 md:px-3 md:py-2 text-xs md:text-sm border border-white/30 animate-pulse">
                            <span className="font-bold w-8 md:w-12 text-yellow-300">R{currentRound}</span>
                            <div className="flex gap-1 md:gap-2 flex-1 justify-center">
                              {turnDarts.map((d, dIdx) => (
                                <span key={dIdx} className={`w-6 md:w-8 text-center font-bold ${d.points === 0 ? 'text-red-300' : ''}`}>
                                  {getDartLabel(d)}
                                </span>
                              ))}
                              {Array.from({ length: 3 - turnDarts.length }).map((_, i) => (
                                <span key={`empty-cur-${i}`} className="w-6 md:w-8 text-center opacity-50">-</span>
                              ))}
                            </div>
                            <span className="font-black w-8 md:w-10 text-right text-white">
                              {currentTotalDarts}
                            </span>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="mt-3 md:mt-4 pt-3 md:pt-4 border-t border-slate-700 shrink-0">
              <div className="flex justify-center gap-2 md:gap-3 mb-3 md:mb-4">
                {[0, 1, 2].map(i => {
                  const dart = turnDarts[i];
                  return (
                    <div key={i} className={`w-12 h-12 md:w-16 md:h-16 rounded-xl flex flex-col items-center justify-center border-2 md:border-4 ${dart ? (dart.points === 0 ? 'bg-slate-900 border-slate-500 text-slate-400' : 'bg-white border-slate-300 text-slate-800') : 'bg-slate-800 border-slate-600 text-slate-600'}`}>
                      <span className={`text-xl md:text-2xl font-black ${dart && dart.points === 0 ? 'text-red-500' : ''}`}>{dart ? dart.points : '-'}</span>
                      {dart && <span className="text-[8px] md:text-[10px] font-bold tracking-widest mt-0 md:mt-1 text-slate-500">{getDartLabel(dart)}</span>}
                    </div>
                  )
                })}
              </div>
              <button onClick={undoLastDart} disabled={turnDarts.length === 0 || turnMessage !== ''} className="w-full py-3 md:py-4 bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-600 rounded-xl border border-slate-500 text-lg md:text-xl font-bold flex items-center justify-center gap-2 md:gap-3 transition-colors">
                <Undo2 className="w-5 h-5 md:w-6 md:h-6" /> 復原上一鏢
              </button>
            </div>
          </div>

          {/* 右側：響應式靶面區域。使用 flex-1 搭配 min-w-0 min-h-0 確保它絕不溢出 */}
          <div className="flex-1 min-w-0 min-h-0 relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950 p-2 md:p-4 flex items-center justify-center overflow-hidden">
            
            {turnMessage && !winner && (
              <div className="absolute z-20 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/90 text-white text-4xl md:text-8xl font-black py-4 px-8 md:py-8 md:px-16 rounded-2xl md:rounded-3xl border-4 md:border-8 border-red-500 shadow-2xl backdrop-blur-sm animate-pulse whitespace-nowrap">
                {turnMessage}
              </div>
            )}
            {winner && (
              <div className="absolute z-50 inset-0 bg-black/90 flex flex-col items-center justify-center backdrop-blur-md">
                <Trophy className="w-32 h-32 md:w-48 md:h-48 text-yellow-400 mb-4 md:mb-8 animate-bounce" />
                {isDoubleOut && currentRound > (startingScore === 301 ? 10 : 15) && (
                  <p className="text-2xl md:text-4xl text-slate-300 font-bold mb-2 md:mb-4">局數已達上限</p>
                )}
                <h2 className="text-5xl md:text-9xl font-black text-white mb-4 md:mb-6 text-center">{winner.name} <span className="text-yellow-400">獲勝！</span></h2>
                <button onClick={resetGame} className="mt-6 md:mt-12 px-8 py-4 md:px-12 md:py-6 bg-blue-600 hover:bg-blue-700 text-2xl md:text-4xl font-bold rounded-xl md:rounded-2xl shadow-xl flex items-center gap-3 md:gap-4 transition-transform active:scale-95">
                  <RotateCcw className="w-8 h-8 md:w-10 md:h-10" /> 再玩一局
                </button>
              </div>
            )}

            {/* SVG 靶面設定了 w-full h-full object-contain 讓它永遠滿版且不變形 */}
            <svg 
              ref={svgRef} 
              viewBox="0 0 600 600" 
              className="w-full h-full max-w-full max-h-full object-contain cursor-crosshair touch-none select-none drop-shadow-2xl" 
              onPointerDown={handleBoardClick}
            >
              <rect x="-1000" y="-1000" width="3000" height="3000" fill="transparent" />

              <circle cx="300" cy="300" r={RADIUS.BOARD} fill="#0a0a0a" />
              <circle cx="300" cy="300" r={RADIUS.BOARD} fill="none" stroke="#d1d5db" strokeWidth="3" />

              {SECTORS.map((sector, i) => {
                const startA = i * 18 - 9;
                const endA = i * 18 + 9;
                const isRedGreen = i % 2 === 0;
                const colorDoubleTreble = isRedGreen ? '#e11d48' : '#16a34a';
                const colorSingle = isRedGreen ? '#111827' : '#fdf5e6';

                const isTargetDouble = checkIsTarget(sector * 2, true);
                const isTargetOuterSingle = checkIsTarget(sector, false);
                const isTargetTreble = checkIsTarget(sector * 3, false);
                const isTargetInnerSingle = checkIsTarget(sector, false);

                return (
                  <g key={`sector-${sector}`}>
                    <path d={getWedgePath(RADIUS.DOUBLE_OUT, startA, endA)} fill={colorDoubleTreble} stroke="#d1d5db" strokeWidth="1.5" className={`transition-opacity ${isTargetDouble ? 'checkout-target' : 'hover:opacity-80'}`} />
                    <path d={getWedgePath(RADIUS.DOUBLE_IN, startA, endA)} fill={colorSingle} stroke="#d1d5db" strokeWidth="1.5" className={`transition-opacity ${isTargetOuterSingle ? 'checkout-target' : 'hover:opacity-80'}`} />
                    <path d={getWedgePath(RADIUS.TREBLE_OUT, startA, endA)} fill={colorDoubleTreble} stroke="#d1d5db" strokeWidth="1.5" className={`transition-opacity ${isTargetTreble ? 'checkout-target' : 'hover:opacity-80'}`} />
                    <path d={getWedgePath(RADIUS.TREBLE_IN, startA, endA)} fill={colorSingle} stroke="#d1d5db" strokeWidth="1.5" className={`transition-opacity ${isTargetInnerSingle ? 'checkout-target' : 'hover:opacity-80'}`} />
                  </g>
                );
              })}

              <circle cx="300" cy="300" r={RADIUS.BULL_OUT} fill="#16a34a" stroke="#d1d5db" strokeWidth="1.5" className={`transition-opacity ${checkIsTarget(25, false) ? 'checkout-target' : 'hover:opacity-80'}`} />
              <circle cx="300" cy="300" r={RADIUS.BULL_IN} fill="#e11d48" stroke="#d1d5db" strokeWidth="1.5" className={`transition-opacity ${checkIsTarget(50, true) ? 'checkout-target' : 'hover:opacity-80'}`} />

              {SECTORS.map((sector, i) => {
                const angleRad = (i * 18 - 90) * (Math.PI / 180);
                const x = 300 + RADIUS.NUMBERS * Math.cos(angleRad);
                const y = 300 + RADIUS.NUMBERS * Math.sin(angleRad);
                return (
                  <text 
                    key={`text-${sector}`} x={x} y={y} 
                    fill="#ffffff" fontSize="32" fontWeight="900" 
                    textAnchor="middle" dominantBaseline="central"
                    className="pointer-events-none drop-shadow-md"
                  >
                    {sector}
                  </text>
                );
              })}

              {turnDarts.map((dart, idx) => (
                <g key={idx} transform={`translate(${dart.pos.x}, ${dart.pos.y})`} className="pointer-events-none">
                  <circle cx="-4" cy="4" r="12" fill="rgba(0,0,0,0.5)" filter="blur(2px)" />
                  <circle cx="0" cy="0" r="14" fill={dart.points === 0 ? "#64748b" : "#3b82f6"} stroke="#ffffff" strokeWidth="4" />
                  <circle cx="0" cy="0" r="5" fill="#000000" />
                  <text x="20" y="-20" fill="#ffffff" fontSize="24" fontWeight="black" stroke="#000" strokeWidth="1" filter="drop-shadow(1px 1px 2px rgba(0,0,0,0.8))">
                    {idx + 1}
                  </text>
                </g>
              ))}
            </svg>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
